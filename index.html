<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดจองงาน — รับส่ง / ทัวร์</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#6b7280;--bd:#e3e6ec;--pr:#0f766e;--prt:#fff;--ac:#ccfbf1;--wa:#16a34a;--fb:#1877f2;--ln:#06c755;--rd:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212b;--tx:#e8ebf0;--mu:#97a0ae;--bd:#2c3441;--pr:#2dd4bf;--prt:#06231f;--ac:#12332f}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:15px}
.wrap{max-width:1280px;margin:0 auto;padding:14px}
.head-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
h1{font-size:20px;margin:0}
.grid{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}

/* ปฏิทิน 2 เดือน (บน-ล่าง) + ต้นเดือนถัดไปจนจบสัปดาห์ */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-weight:700;font-size:17px}
.cal-nav-g{display:flex;gap:6px;align-items:center}
.cal-m-title{font-size:15px;font-weight:700;color:var(--pr);margin:10px 0 6px;display:flex;justify-content:space-between;align-items:center}
.cal-m-title:first-child{margin-top:2px}
.cal-sep{border:0;border-top:1px dashed var(--bd);margin:12px 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:12px;color:var(--mu);padding:3px 0}
.day{
  min-height:60px;font-size:15px;font-weight:600;
  border:1px solid transparent;border-radius:10px;
  background:none;color:var(--tx);font-family:inherit;cursor:pointer;
  position:relative;padding:4px 2px 13px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  overflow:hidden;
}
.day:hover{background:var(--bg)}
.day.today{border-color:var(--pr)}
.day.next-m{background:var(--bg);color:var(--mu);border-color:var(--bd)}
.day.next-m .dnum{font-size:12px;font-weight:600}
.day.sel{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.day .dnum{line-height:1.2}
.day .n{position:absolute;top:2px;right:3px;font-size:10px;font-weight:700;background:var(--ac);color:var(--tx);border-radius:8px;padding:0 5px}
.day.sel .n{background:var(--prt);color:var(--pr)}
.mbars{width:100%;display:flex;flex-direction:column;gap:2px;margin-top:3px;padding:0 1px}
.mbar{width:100%;height:7px;border-radius:4px;font-size:0;line-height:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:0 0 0 1px rgba(255,255,255,.45)}
.day.sel .mbar{box-shadow:0 0 0 1px rgba(255,255,255,.85)}

/* จานสี & แผนงานรายวัน */
.swatches{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:4px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:transform .12s}
.sw:hover{transform:scale(1.1)}
.sw.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--card) inset}
.sw-auto{width:auto;padding:0 10px;border-radius:14px;background:var(--bg);border:1px solid var(--bd);color:var(--tx)}
.sw-auto.on{border-color:var(--pr);background:var(--ac);box-shadow:none}
.day-info{font-size:12px;color:var(--pr);font-weight:600;margin-top:3px}
.dp-box{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:2px}
.dp-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.dp-row{display:grid;grid-template-columns:110px 1fr 105px;gap:6px;align-items:center}
.dp-lbl{font-size:12.5px;font-weight:600;color:var(--tx);white-space:nowrap}
.dp-inp,.dp-price{background:var(--card);padding:6px 9px;font-size:14px}
.dp-price{text-align:right}
.dp-total{font-size:12.5px;font-weight:700;color:var(--pr);margin-top:8px;text-align:right}
.dp-card{margin:8px 0 4px;padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;font-size:13.5px}
.dp-card-title{font-size:12px;font-weight:700;color:var(--mu);margin-bottom:4px}
.dp-item{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:3px 6px;border-radius:6px;line-height:1.5}
.dp-item.now{background:var(--ac);font-weight:700;color:var(--tx)}
.dp-badge{font-size:11px;background:var(--pr);color:var(--prt);padding:1px 6px;border-radius:6px;margin-left:4px}
.dp-p{font-weight:700;color:var(--pr);white-space:nowrap}

button,input,select,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:4px 9px;font-size:13px}
.nav{background:var(--bg);border:1px solid var(--bd);border-radius:8px;font-size:20px;padding:3px 14px;cursor:pointer}
#fm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#fm .f{grid-column:1/-1}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px}
textarea{min-height:56px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px}
.sum{font-size:13px;color:var(--mu)}
.job{border:1px solid var(--bd);border-radius:12px;padding:11px;margin-bottom:9px;background:var(--card)}
.job.done{opacity:.6}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.t{font-weight:700}
.tag{display:inline-block;font-size:11px;border-radius:7px;padding:1px 7px;background:var(--ac);margin-right:4px;margin-top:2px}
.pr{font-weight:700;color:var(--pr);white-space:nowrap}
.rt{margin:6px 0;line-height:1.6}
.lk{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lk a{font-size:12.5px;text-decoration:none;color:#fff;border-radius:8px;padding:3px 10px;background:#64748b}
.lk .wa{background:var(--wa)}.lk .fb{background:var(--fb)}.lk .ln{background:var(--ln)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mu);padding:26px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(520px,92vw)}
.dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.dots i{width:7px;height:7px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:10px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:30px;padding:13px 20px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:block!important}

/* =========================================================
   สไตล์ระบบป้ายชูรับลูกค้า + คลังโลโก้หลายแบบ + Fullscreen + Print
   ========================================================= */
#signModal{width:min(780px,96vw);max-height:92vh;padding:16px;overflow:auto}
.sign-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sign-grid .f{grid-column:1/-1}
.logo-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.logo-item{
  position:relative;width:72px;height:56px;border-radius:10px;
  border:2px solid var(--bd);background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:4px;overflow:visible;
}
.logo-item.on{border-color:var(--pr);background:var(--ac);box-shadow:0 0 0 1px var(--pr)}
.logo-item img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.logo-none{font-size:12px;font-weight:600;color:var(--mu);text-align:center;line-height:1.2}
.logo-del{
  position:absolute;top:-7px;right:-7px;width:20px;height:20px;
  border-radius:50%;border:0;background:var(--rd);color:#fff;
  font-size:12px;line-height:1;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
}
.logo-add-btn{
  display:inline-flex;align-items:center;justify-content:center;
  height:56px;padding:0 14px;border-radius:10px;
  border:2px dashed var(--pr);color:var(--pr);background:var(--bg);
  font-size:13px;font-weight:700;cursor:pointer;
}
.logo-add-btn:hover{background:var(--ac)}
.sign-preview-wrap{margin-top:12px;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#e5e7eb}

/* กล่องตัวป้าย */
.sign-board{
  width:100%;aspect-ratio:1.414/1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:5% 6%;gap:14px;
  background:#ffffff;color:#0f172a;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.sign-board.th-navy{background:#0f172a;color:#f8fafc}
.sign-board.th-navy .sb-head{color:#fbbf24}
.sign-board.th-navy .sb-flight{background:#1e293b;color:#fbbf24;border-color:#334155}
.sign-board.th-teal{background:#0f766e;color:#ffffff}
.sign-board.th-teal .sb-head{color:#ccfbf1}
.sign-board.th-teal .sb-flight{background:rgba(255,255,255,.15);color:#ffffff;border-color:rgba(255,255,255,.35)}
.sign-board.th-dark{background:#111111;color:#ffffff}
.sign-board.th-dark .sb-head{color:#a3a3a3}
.sign-board.th-dark .sb-flight{background:#262626;color:#ffffff;border-color:#404040}

.sb-logo{max-width:65%;object-fit:contain;display:block}
.sb-head{font-size:clamp(14px,2.5vw,26px);font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#0f766e}
.sb-name{font-weight:800;line-height:1.15;word-break:break-word;max-width:100%}
.sb-flight{
  display:inline-flex;align-items:center;gap:8px;
  font-size:clamp(16px,2.6vw,30px);font-weight:700;
  padding:6px 20px;border-radius:999px;
  background:#f1f5f9;color:#0f172a;border:2px solid #cbd5e1;
}
.sb-sub{font-size:clamp(13px,1.8vw,20px);opacity:.82;max-width:90%}

/* โหมดเต็มหน้าจอ */
#signFs{display:none;position:fixed;inset:0;z-index:9999;background:#fff}
#signFs.show{display:flex;align-items:center;justify-content:center}
#signFs .sign-board{width:100vw;height:100vh;aspect-ratio:auto;padding:4vh 5vw}
.fs-exit{
  position:fixed;top:14px;right:14px;z-index:10000;
  background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:999px;
  padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(4px);
}
.fs-exit:hover{background:rgba(0,0,0,.75)}

/* โหมดสั่งพิมพ์ A4 แนวนอน */
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  body > *:not(#printArea), dialog{display:none!important}
  #printArea{display:block!important;position:fixed;inset:0;width:100vw;height:100vh;margin:0;padding:0}
  #printArea .sign-board{width:100vw!important;height:100vh!important;aspect-ratio:auto!important;border:0!important;border-radius:0!important}
}

@media(max-width:860px){.wrap{padding-bottom:90px}}
@media(max-width:560px){
  input,select,textarea{font-size:16px}
  #fm,.sign-grid{grid-template-columns:1fr}
  .dp-row{grid-template-columns:1fr 95px;gap:5px}
  .dp-lbl{grid-column:1/-1;margin-top:2px}
  .btn,.nav{min-height:42px}.btn.sm{min-height:38px;padding:6px 12px}
  .lk a{padding:8px 12px;font-size:14px}.day .n{font-size:9px;padding:0 4px}.dow{font-size:11px}.wrap{padding:10px}
}
@media(min-width:861px){
  .grid{grid-template-columns:560px minmax(0,1fr)}
  .day{min-height:74px;font-size:17px}
  .mbar{height:15px;font-size:10px;line-height:15px;color:#fff;padding:0 4px;text-align:left;font-weight:600}
}
#ov{display:none}
#ov.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.addpop{display:none}
.addpop.show{display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;width:min(600px,94vw);max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <div class="head-bar">
    <h1>📒 สมุดจองงาน — รับส่ง / ทัวร์</h1>
    <button class="btn g sm" id="openSignTopBtn">🪧 สร้างป้ายชู</button>
  </div>
  <div class="grid">
    <div>
      <!-- การ์ดปฏิทินแบบ 2 เดือน (บน-ล่าง) + ต้นเดือนถัดไปจนจบสัปดาห์ -->
      <div class="card">
        <div class="cal-h">
          <button class="nav" id="pv" title="ย้อนกลับ 1 เดือน">‹</button>
          <span id="mt"></span>
          <div class="cal-nav-g">
            <button class="btn g sm" id="tdBtn">วันนี้</button>
            <button class="nav" id="nx" title="ถัดไป 1 เดือน">›</button>
          </div>
        </div>
        <div id="calWrap"></div>
        <div class="lg" id="lg"></div>
        <div class="sum" style="margin-top:4px;font-size:11.5px">💡 แถบสีแนวนอน = งานจองหลายวัน · จุดสีด้านล่าง = งานวันเดียว · ช่องสีเทาอ่อน = ต้นเดือนถัดไป</div>
      </div>

      <!-- ป๊อปอัปเพิ่ม/แก้ไขงาน -->
      <div class="card addpop" id="ad" style="margin-top:14px">
        <b id="ft">เพิ่มงานใหม่</b><button class="btn g sm" id="adx" type="button" style="float:right">ปิด</button>
        <form id="fm">
          <div>
            <label>วันที่เริ่ม</label>
            <input type="date" id="date" required>
          </div>
          <div>
            <label>วันที่สิ้นสุด (ถ้าจองหลายวัน)</label>
            <input type="date" id="endDate">
            <div class="day-info" id="dayInfo"></div>
          </div>

          <div class="f dp-box" id="dayPlansBox" hidden>
            <label style="color:var(--pr);font-weight:700">📋 แผนงานรายวัน & ราคาต่อวัน (บาท)</label>
            <div class="dp-list" id="dayPlansList"></div>
            <div class="dp-total" id="dpTotal"></div>
          </div>

          <div><label>เวลา (24 ชม.)</label><input id="time" inputmode="numeric" maxlength="5" placeholder="14:30" autocomplete="off"></div>
          <div><label>✈️ ไฟล์ทบิน (Flight)</label><input id="flight" placeholder="เช่น TG102 / FD3437" autocomplete="off"></div>
          <div><label>ประเภทงาน</label><select id="type"><option>รับ</option><option>ส่ง</option><option>ทัวร์</option><option>อื่นๆ</option></select></div>
          <div><label>สถานะ</label><select id="st"><option>รอยืนยัน</option><option>ยืนยันแล้ว</option><option>เสร็จแล้ว</option><option>ยกเลิก</option></select></div>
          <div><label>เจ้าของงาน</label><select id="owner"></select><input id="onew" placeholder="พิมพ์ชื่อเจ้าของใหม่" autocomplete="off" style="margin-top:6px;display:none"></div>
          <div><label>ช่องทางติดต่อ</label><select id="ch"><option>WhatsApp</option><option>Line</option><option>Facebook</option><option>Telegram</option><option>Instagram</option><option>โทร</option><option>อื่นๆ</option></select></div>
          <div class="f"><label>ชื่อลูกค้า</label><input id="name" required placeholder="เช่น Mr. John Smith / คุณสมชาย"></div>
          <div class="f">
            <label>🎨 สีแถบงานบนปฏิทิน (แบ่งสีงานหลายวัน)</label>
            <input type="hidden" id="color" value="">
            <div class="swatches" id="swatches"></div>
          </div>
          <div class="f"><label>เบอร์ / ID / ลิงก์</label><input id="ct" placeholder="เช่น 0812345678"></div>
          <div class="f"><label>รับจากที่ไหน</label><input id="from" placeholder="โรงแรม / สนามบิน / จุดนัด"></div>
          <div class="f"><label>ไปส่งที่ / สถานที่ท่องเที่ยว / ทัวร์</label><input id="to" placeholder="เช่น ดอยอินทนนท์"></div>
          <div><label>จำนวนคน</label><input type="number" id="pax" min="0" placeholder="0"></div>
          <div><label>ราคารวมทั้งหมด (บาท)</label><input type="number" id="price" min="0" placeholder="0"></div>
          <div class="f"><label>รายละเอียด / หมายเหตุรวม</label><textarea id="note" placeholder="ที่นั่งเด็ก, ป้ายชื่อ, หมายเหตุ ฯลฯ"></textarea></div>
          <div class="f" style="display:flex;gap:8px"><button class="btn" style="flex:1" type="submit" id="sv">บันทึก</button><button class="btn g" type="button" id="cn" hidden>ยกเลิกแก้ไข</button></div>
        </form>
      </div>
    </div>

    <!-- รายการงานฝั่งขวา -->
    <div class="card">
      <div class="row">
        <div><b id="lt"></b><div class="sum" id="sm"></div><div class="sum" id="ss"></div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn g sm" id="vd">เฉพาะวันที่เลือก</button>
          <button class="btn g sm" id="vm">ทั้งเดือน</button>
          <button class="btn g sm" id="bk">สำรองข้อมูล</button>
          <button class="btn g sm" id="tr">🗑️ ถังขยะ</button>
          <button class="btn g sm" id="sy">☁️ ซิงก์เลย</button>
        </div>
      </div>
      <input id="q" placeholder="🔍 ค้นหาชื่อ / ไฟล์ทบิน / สถานที่ / แผนรายวัน / เบอร์" style="margin-bottom:10px">
      <div id="list"></div>
    </div>
  </div>
</div>
<button class="btn fab" id="fab">+ เพิ่มงาน</button>

<!-- หน้าต่างสร้างป้ายชูรับลูกค้า (รองรับคลังโลโก้หลายแบบ) -->
<dialog id="signModal">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b>🪧 สร้างป้ายชูรับลูกค้า (Welcome Sign)</b>
    <button class="btn g sm" id="signClose" type="button">ปิด</button>
  </div>
  <div class="sign-grid">
    <div>
      <label>ข้อความหัวป้าย</label>
      <input id="sHead" value="WELCOME" placeholder="เช่น WELCOME / ยินดีต้อนรับ">
    </div>
    <div>
      <label>ธีมสีป้าย</label>
      <select id="sTheme">
        <option value="">ขาวคลาสสิก (อ่านง่าย/ประหยัดหมึก)</option>
        <option value="th-navy">กรมท่า–ทอง (หรูหรา)</option>
        <option value="th-teal">เขียวอมฟ้า–ขาว</option>
        <option value="th-dark">ดำ–ขาว (ชูกลางคืนชัด)</option>
      </select>
    </div>
    <div class="f">
      <label>ชื่อลูกค้าบนป้าย</label>
      <input id="sName" placeholder="เช่น MR. JOHN SMITH">

<script>
// =======================================================
// 1. ตั้งค่าหลัก (ใส่ลิงก์ Web App /exec ของคุณไว้เรียบร้อยแล้ว)
// =======================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz5kMUgdEdBwMcaN4UYsnMQbHRutZsB7UjK5IZGGRaHhUkDFQp5HW-bDdWbO9xpGdOTPg/exec';

// ชุดสีสำหรับเลือกแบ่งสีงานจองหลายวัน
const COLOR_PALETTE = [
  { code: '',        label: 'สีตามประเภท' },
  { code: '#7c3aed', label: 'ม่วง' },
  { code: '#ea580c', label: 'ส้ม' },
  { code: '#db2777', label: 'ชมพู' },
  { code: '#2563eb', label: 'น้ำเงิน' },
  { code: '#ca8a04', label: 'เหลืองทอง' },
  { code: '#0d9488', label: 'เขียวมิ้นต์' },
  { code: '#dc2626', label: 'แดง' },
  { code: '#475569', label: 'เทาเข้ม' }
];

const TC = { 'รับ':'#16a34a', 'ส่ง':'#dc2626', 'ทัวร์':'#0ea5e9', 'อื่นๆ':'#64748b' };

const $=id=>document.getElementById(id);
const KEY='booking-planner-v1';

// =======================================================
// 2. ฟังก์ชันจัดการวันที่/เวลา (ป้องกัน GMT)
// =======================================================
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseLocal(s){
  if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;
  const [y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d);
}
function cleanDate(v){
  const s=String(v||'').trim();
  if(!s)return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const d=new Date(s);
  return isNaN(d.getTime())?'':iso(d);
}
function cleanTime(v){
  const s=String(v||'').trim();
  if(!s)return '';
  if(/^\d{1,2}:\d{2}$/.test(s)){ const [h,m]=s.split(':'); return pad(h)+':'+pad(m); }
  if(s.includes('GMT')||s.includes('1899')){
    const d=new Date(s);
    if(!isNaN(d.getTime()))return pad(d.getHours())+':'+pad(d.getMinutes());
  }
  return s;
}

const thMonth=d=>d.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
const thMonthShort=d=>d.toLocaleDateString('th-TH',{month:'short',year:'2-digit'});
const thDate=s=>{const d=parseLocal(s);return d?d.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):s};
const thShort=s=>{const d=parseLocal(s);return d?d.toLocaleDateString('th-TH',{day:'numeric',month:'short'}):s};
const baht=n=>Number(n||0).toLocaleString('th-TH');

function addDays(startIso, offset){
  const d=parseLocal(startIso);
  if(!d)return '';
  d.setDate(d.getDate()+offset);
  return iso(d);
}

const getEndDate=j=>(j.endDate&&j.endDate>=j.date)?j.endDate:j.date;
const coversDate=(j,d)=>Boolean(j.date)&&d>=j.date&&d<=getEndDate(j);
const overlapsMonth=(j,y,m)=>{
  if(!j.date)return false;
  const mStart=y+'-'+pad(m+1)+'-01';
  const mEnd=y+'-'+pad(m+1)+'-'+pad(new Date(y,m+1,0).getDate());
  return j.date<=mEnd&&getEndDate(j)>=mStart;
};
function dayCount(j){
  const s=parseLocal(j.date), e=parseLocal(getEndDate(j));
  if(!s||!e||e<=s)return 1;
  return Math.round((e-s)/86400000)+1;
}
function dayNumber(j,d){
  const s=parseLocal(j.date), curD=parseLocal(d);
  if(!s||!curD)return 1;
  return Math.round((curD-s)/86400000)+1;
}
const jobColor=j=>j.color||TC[j.type]||'#64748b';

function normalizePlans(arr){
  if(!Array.isArray(arr))return [];
  return arr.map(item=>{
    if(typeof item==='string')return { text: item.trim(), price: '' };
    if(item && typeof item==='object'){
      return {
        text: String(item.text||'').trim(),
        price: item.price!==undefined && item.price!==null ? String(item.price).trim() : ''
      };
    }
    return { text: '', price: '' };
  });
}

// =======================================================
// 3. ระบบแผนงานรายวัน + ราคารายวันในฟอร์ม
// =======================================================
function getCurrentDayPlanInputs(){
  return [...document.querySelectorAll('.dp-row')].map(row=>({
    text: (row.querySelector('.dp-inp')?.value||'').trim(),
    price: (row.querySelector('.dp-price')?.value||'').trim()
  }));
}
function recalcDayPrices(syncMainPrice){
  const inputs=[...document.querySelectorAll('.dp-price')];
  let sum=0, hasAny=false;
  inputs.forEach(el=>{
    const v=el.value.trim();
    if(v!==''){ hasAny=true; sum+=Number(v)||0; }
  });
  $('dpTotal').textContent=hasAny?`รวมราคารายวัน: ${baht(sum)} บาท`:'';
  if(syncMainPrice && hasAny) $('price').value=sum;
}
function renderDayPlanInputs(presetPlans){
  const s=$('date').value, e=$('endDate').value;
  $('endDate').min=s||'';
  const sD=parseLocal(s), eD=parseLocal(e);

  if(!sD||!eD||eD<=sD){
    $('dayInfo').textContent='';
    $('dayPlansBox').hidden=true;
    $('dayPlansList').innerHTML='';
    $('dpTotal').textContent='';
    return;
  }

  const n=Math.round((eD-sD)/86400000)+1;
  $('dayInfo').textContent=`📅 งานจองยาว ${n} วัน (${thShort(s)} – ${thShort(e)})`;
  const prev = Array.isArray(presetPlans) ? normalizePlans(presetPlans) : getCurrentDayPlanInputs();
  const limit = Math.min(n, 60);
  const placeholders = [
    'เช่น รับเข้าสนามบิน -> ส่งโรงแรม',
    'เช่น พาเที่ยววัด / คาเฟ่',
    'เช่น ไปดอยสุเทพ / ดอยอินทนนท์',
    'เช่น ไปอ่างเก็บน้ำ / ตลาด',
    'เช่น ส่งสนามบิน / จบทริป'
  ];

  let html='';
  for(let i=0;i<limit;i++){
    const dStr=addDays(s,i);
    const item=prev[i]||{ text:'', price:'' };
    const ph=placeholders[Math.min(i,placeholders.length-1)];
    html+=`<div class="dp-row">
      <div class="dp-lbl">วันที่ ${i+1} (${thShort(dStr)})</div>
      <input type="text" class="dp-inp" value="${esc(item.text)}" placeholder="${ph}">
      <input type="number" class="dp-price" min="0" value="${esc(item.price)}" placeholder="ราคา (฿)">
    </div>`;
  }
  if(n>60) html+=`<div class="sum">แสดงช่องกรอกสูงสุด 60 วันแรก</div>`;
  $('dayPlansList').innerHTML=html;
  $('dayPlansBox').hidden=false;

  $('dayPlansList').querySelectorAll('.dp-price').forEach(el=>{
    el.addEventListener('input',()=>recalcDayPrices(true));
  });
  recalcDayPrices(false);
}

$('date').addEventListener('change',()=>{
  if($('endDate').value&&$('endDate').value<$('date').value)$('endDate').value=$('date').value;
  renderDayPlanInputs();
});
$('endDate').addEventListener('change',()=>renderDayPlanInputs());

function drawSwatches(selected){
  $('color').value=selected||'';
  $('swatches').innerHTML=COLOR_PALETTE.map(c=>{
    const on=(selected||'')===c.code?' on':'';
    if(!c.code) return `<button type="button" class="sw sw-auto${on}" data-c="" title="${c.label}">${c.label}</button>`;
    return `<button type="button" class="sw${on}" data-c="${c.code}" style="background:${c.code}" title="${c.label}"></button>`;
  }).join('');
  $('swatches').querySelectorAll('.sw').forEach(b=>b.onclick=()=>drawSwatches(b.dataset.c));
}

// =======================================================
// 4. ระบบจัดการข้อมูล + ปฏิทิน 2 เดือน (บน-ล่าง) + ต้นเดือนถัดไป
// =======================================================
let jobs=[];try{jobs=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){jobs=[]}
let trash=[];try{trash=JSON.parse(localStorage.getItem(KEY+'-trash')||'[]')}catch(e){trash=[]}

const fixT=a=>a.forEach(j=>{
  if(j.type==='รับ-ส่ง'||j.type==='รับ / ส่ง')j.type='รับ';
  else if(j.type==='เช่ารถ')j.type='อื่นๆ';
  j.date=cleanDate(j.date);
  j.endDate=cleanDate(j.endDate);
  if(j.endDate&&j.endDate<=j.date)j.endDate='';
  j.time=cleanTime(j.time);
  if(typeof j.dayPlans==='string'){
    try{j.dayPlans=JSON.parse(j.dayPlans)}catch(e){j.dayPlans=[]}
  }
  j.dayPlans=normalizePlans(j.dayPlans);
});
fixT(jobs);fixT(trash);

const saveL=()=>{try{localStorage.setItem(KEY,JSON.stringify(jobs));localStorage.setItem(KEY+'-trash',JSON.stringify(trash))}catch(e){}};
const save=()=>{saveL();sched()};
const today=new Date();
let cur=new Date(today.getFullYear(),today.getMonth(),1),sel=iso(today),mode='day',editId=null;

function links(j){
  const c=(j.ct||'').trim(),out=[];if(!c)return out;
  const isUrl=/^https?:\/\//i.test(c),digits=c.replace(/[^\d]/g,'');
  const intl=digits.startsWith('0')?'66'+digits.slice(1):digits;
  const id=c.replace(/^@/,'');
  if(j.ch==='WhatsApp')out.push(['wa','💬 เปิด WhatsApp',isUrl?c:'https://wa.me/'+intl]);
  else if(j.ch==='Line')out.push(['ln','💚 เปิด Line',isUrl?c:'https://line.me/ti/p/~'+id]);
  else if(j.ch==='Facebook')out.push(['fb','📘 เปิด Facebook',isUrl?c:'https://m.me/'+id]);
  else if(j.ch==='Telegram')out.push(['','✈️ เปิด Telegram',isUrl?c:'https://t.me/'+id]);
  else if(j.ch==='Instagram')out.push(['','📷 เปิด Instagram',isUrl?c:'https://instagram.com/'+id]);
  else if(isUrl)out.push(['','🔗 เปิดลิงก์',c]);
  if(digits.length>=8&&!isUrl)out.push(['','📞 โทร','tel:'+c.replace(/[^\d+]/g,'')]);
  return out;
}

function buildDayCell(dateIso, labelText, isNextMonth){
  const dj=jobs.filter(j=>coversDate(j,dateIso)&&j.st!=='ยกเลิก');
  const n=dj.length;
  const multi=dj.filter(j=>dayCount(j)>1).sort((a,b)=>a.date.localeCompare(b.date));
  const single=dj.filter(j=>dayCount(j)===1);

  const barsHtml=multi.length
    ? `<span class="mbars">${multi.slice(0,3).map(j=>{
        const idx=dayNumber(j,dateIso)-1;
        const pItem=(j.dayPlans&&j.dayPlans[idx])||{};
        const pText=pItem.text?` : ${pItem.text}`:'';
        const pPrice=pItem.price?` (${baht(pItem.price)} ฿)`:'';
        return `<span class="mbar" style="background:${jobColor(j)}" title="${esc(j.name)} (วันที่ ${idx+1}/${dayCount(j)}${esc(pText)}${esc(pPrice)})">${esc(j.name)}</span>`;
      }).join('')}</span>`
    : '';
  const dotsHtml=single.length
    ? `<span class="dots">${single.slice(0,4).map(j=>`<i style="background:${jobColor(j)}"></i>`).join('')}</span>`
    : '';

  const cls='day'+(isNextMonth?' next-m':'')+(dateIso===iso(today)?' today':'')+(dateIso===sel?' sel':'');
  return `<button class="${cls}" data-d="${dateIso}">
    <span class="dnum">${labelText}</span>
    ${n?`<span class="n">${n}</span>`:''}
    ${barsHtml}
    ${dotsHtml}
  </button>`;
}

function buildMonthHtml(year, month, includeTrailing){
  const dObj=new Date(year, month, 1);
  const first=dObj.getDay();
  const dim=new Date(year, month+1, 0).getDate();
  let cells=['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) cells+='<div></div>';
  for(let d=1;d<=dim;d++){
    cells+=buildDayCell(year+'-'+pad(month+1)+'-'+pad(d), String(d), false);
  }

  let titleExtra='';
  if(includeTrailing){
    const lastDow=new Date(year, month, dim).getDay();
    const trailingCount = (lastDow===6) ? 7 : (6 - lastDow);
    const nextMonthDate=new Date(year, month+1, 1);
    const ny=nextMonthDate.getFullYear(), nm=nextMonthDate.getMonth();
    const nmShort=nextMonthDate.toLocaleDateString('th-TH',{month:'short'});
    titleExtra=` <span class="sum" style="font-weight:400">+ ต้น ${nmShort}</span>`;
    for(let td=1; td<=trailingCount; td++){
      cells+=buildDayCell(ny+'-'+pad(nm+1)+'-'+pad(td), `${td} ${nmShort}`, true);
    }
  }
  return `<div class="cal-m-title"><span>${thMonth(dObj)}${titleExtra}</span></div><div class="cal">${cells}</div>`;
}

function renderCal(){
  const m1=new Date(cur.getFullYear(), cur.getMonth(), 1);
  const m2=new Date(cur.getFullYear(), cur.getMonth()+1, 1);
  $('mt').textContent=`${thMonthShort(m1)} – ${thMonthShort(m2)}`;
  $('calWrap').innerHTML =
    buildMonthHtml(m1.getFullYear(), m1.getMonth(), false) +
    '<hr class="cal-sep">' +
    buildMonthHtml(m2.getFullYear(), m2.getMonth(), true);

  $('calWrap').querySelectorAll('.day').forEach(b=>b.onclick=()=>{
    sel=b.dataset.d; mode='day'; $('date').value=sel; render();
  });
}

function render(){
  jobs.forEach(j=>{if(j.owner)addOwner(j.owner)});
  renderCal();

  const selObj=parseLocal(sel)||cur;
  const y=selObj.getFullYear(), m=selObj.getMonth();
  const q=$('q').value.trim().toLowerCase();

  let list=jobs.filter(j=>mode==='day'?coversDate(j,sel):overlapsMonth(j,y,m));
  if(q){
    list=jobs.filter(j=>[
      j.name,j.flight,j.owner,j.from,j.to,j.ct,j.note,j.type,
      ...(j.dayPlans||[]).map(p=>p.text||'')
    ].join(' ').toLowerCase().includes(q));
  }
  list.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  $('lt').textContent=q?'ผลการค้นหา':mode==='day'?'งานวันที่ '+thDate(sel):'งานทั้งเดือน '+thMonth(new Date(y,m,1));
  const act=list.filter(j=>j.st!=='ยกเลิก'),tot=act.reduce((a,j)=>a+Number(j.price||0),0);
  $('sm').textContent=`${act.length} งาน · รวม ${baht(tot)} บาท`;

  $('list').innerHTML=list.length?list.map(j=>{
    const col=jobColor(j);
    const days=dayCount(j);
    const curDayNum=(mode==='day'&&!q)?dayNumber(j,sel):0;
    const spanBadge=days>1
      ? `<span class="tag" style="background:${col};color:#fff">📅 ${days} วัน (${thShort(j.date)}–${thShort(getEndDate(j))})${curDayNum?` · วันที่ ${curDayNum}/${days}`:''}</span>`
      : '';
    const flightTag=j.flight?`<span class="tag">✈️ ${esc(j.flight)}</span>`:'';

    let plansHtml='';
    const plans=normalizePlans(j.dayPlans);
    if(days>1 && plans.some(p=>p.text||p.price)){
      let rows='';
      for(let i=0;i<Math.min(days,60);i++){
        const dStr=addDays(j.date,i);
        const item=plans[i]||{ text:'', price:'' };
        const text=item.text?esc(item.text):'<span class="sum">—</span>';
        const priceHtml=item.price?`<span class="dp-p">${baht(item.price)} ฿</span>`:'';
        const isNow=(curDayNum===i+1);
        rows+=`<div class="dp-item${isNow?' now':''}">
          <span>วันที่ ${i+1} (${thShort(dStr)}): ${text}${isNow?'<span class="dp-badge">วันนี้</span>':''}</span>
          ${priceHtml}
        </div>`;
      }
      plansHtml=`<div class="dp-card"><div class="dp-card-title">📋 แผนงานรายวัน & ราคา</div>${rows}</div>`;
    }

    const lk=links(j).map(l=>`<a class="${l[0]}" href="${esc(l[2])}" target="_blank" rel="noopener">${l[1]}</a>`).join('');
    return `<div class="job${j.st==='เสร็จแล้ว'||j.st==='ยกเลิก'?' done':''}" style="border-left:6px solid ${col}">
      <div class="top"><div><div class="t">${esc(j.time||'--:--')} · ${esc(j.name)}</div>
      <div>
        <span class="tag" style="background:${TC[j.type]||'#64748b'};color:#fff">${esc(j.type)}</span>
        <span class="tag">${esc(j.st)}</span>
        ${flightTag}
        ${spanBadge}
        ${(mode==='month'||q)&&days===1?`<span class="sum">${thDate(j.date)}</span>`:''}
      </div></div>
      <div class="pr">${j.price?baht(j.price)+' ฿':''}</div></div>
      ${plansHtml}
      <div class="rt">${j.from?'🚏 รับ: '+esc(j.from)+'<br>':''}${j.to?'🏁 ไป: '+esc(j.to)+'<br>':''}${j.owner?'👤 เจ้าของ: '+esc(j.owner)+'<br>':''}${j.pax?'👥 '+esc(j.pax)+' คน<br>':''}${j.note?'📝 '+esc(j.note):''}</div>
      <div class="sum">ติดต่อ: ${esc(j.ch)} ${esc(j.ct)}</div>
      ${lk?`<div class="lk">${lk}</div>`:''}
      <div class="acts">
        <button class="btn g sm" data-s="${j.id}">🪧 ชูป้าย</button>
        <button class="btn g sm" data-e="${j.id}">แก้ไข</button>
        <button class="btn g sm" data-x="${j.id}" style="color:var(--rd)">ลบ</button>
      </div></div>`}).join(''):'<div class="empty">ยังไม่มีงาน</div>';

  $('list').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
    const j=jobs.find(x=>x.id===b.dataset.s);
    if(j) openSignModal(j);
  });
  $('list').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(b.dataset.e));
  $('list').querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{const j=jobs.find(x=>x.id===b.dataset.x);if(j&&await ask('ลบงานนี้? (ดูย้อนหลังและกู้คืนได้ที่ถังขยะ)')){trash.unshift({...j,del:new Date().toISOString()});jobs=jobs.filter(x=>x.id!==j.id);save();render()}});
}

// 5. ฟอร์มเพิ่ม/แก้ไขงาน

  editId=id;
  F.forEach(k=>$(k).value=j[k]??'');

  drawSwatches(j.color||'');

  $('ft').textContent='แก้ไขงาน';$('sv').textContent='อัปเดต';$('cn').hidden=false;
  $('ad').classList.add('show');$('ov').classList.add('show');
}
function reset(){
  const lo=window.lastOw||'';
  editId=null;$('fm').reset();
  $('owner').value=lo;$('onew').style.display='none';
  $('date').value=sel;$('endDate').value='';
  drawSwatches('');
  renderDayPlanInputs([]);
  $('ft').textContent='เพิ่มงานใหม่';$('sv').textContent='บันทึก';$('cn').hidden=true;

$('fm').onsubmit=e=>{
  e.preventDefault();
  $('time').onblur({target:$('time')});
  const o={};F.forEach(k=>o[k]=$(k).value.trim());
  if(o.owner==='__new')o.owner=$('onew').value.trim();
  if(!o.endDate||o.endDate<=o.date){ o.endDate=''; o.dayPlans=[]; }
  else { o.dayPlans=getCurrentDayPlanInputs(); }
  addOwner(o.owner);window.lastOw=o.owner;
  if(editId){jobs=jobs.map(j=>j.id===editId?{...o,id:editId,upd:Date.now()}:j)}
  else jobs.push({...o,id:Date.now().toString(36),upd:Date.now()});
  save();sel=o.date;cur=new Date(sel.slice(0,4),sel.slice(5,7)-1,1);mode='day';
  reset();closeAd();render();
  if(innerWidth<=860)$('lt').scrollIntoView({behavior:'smooth'});
};
$('cn').onclick=()=>{reset();closeAd()};
$('pv').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$('nx').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
$('tdBtn').onclick=()=>{cur=new Date(today.getFullYear(),today.getMonth(),1);sel=iso(today);mode='day';$('date').value=sel;render()};
$('vd').onclick=()=>{mode='day';render()};$('vm').onclick=()=>{mode='month';render()};
$('q').oninput=render;
$('bk').onclick=()=>{$('bx').value=JSON.stringify(jobs);$('dg').showModal()};
$('cl').onclick=()=>$('dg').close();
$('cp').onclick=()=>{$('bx').select();try{navigator.clipboard.writeText($('bx').value)}catch(e){document.execCommand('copy')}};
$('rs').onclick=async()=>{let a;try{a=JSON.parse($('bx').value)}catch(e){}if(!Array.isArray(a)){$('bx').value='';$('bx').placeholder='ข้อมูลไม่ถูกต้อง';return}if(await ask('แทนที่ข้อมูลปัจจุบันทั้งหมด?')){a.forEach(j=>j.upd=Date.now());jobs=a;fixT(jobs);save();$('dg').close();render()}};
function setT(t){$('time').value=t||''}
$('time').oninput=e=>{const d=e.target.value.replace(/\D/g,'').slice(0,4);e.target.value=d.length>2?d.slice(0,2)+':'+d.slice(2):d};
$('time').onblur=e=>{const d=e.target.value.replace(/\D/g,'');if(!d)return;let h,m;if(d.length<=2){h=d;m='00'}else if(d.length===3){h='0'+d[0];m=d.slice(1)}else{h=d.slice(0,2);m=d.slice(2)}e.target.value=pad(Math.min(+h,23))+':'+pad(Math.min(+m,59))};
function closeAd(){$('ad').classList.remove('show');$('ov').classList.remove('show')}
$('fab').onclick=()=>{reset();$('ad').classList.add('show');$('ov').classList.add('show')};
$('adx').onclick=closeAd;$('ov').onclick=closeAd;
let owners=[];try{owners=JSON.parse(localStorage.getItem(KEY+'-owners')||'[]')}catch(e){owners=[]}
function drawOwners(){const v=$('owner').value;$('owner').innerHTML='<option value="">— ไม่ระบุ —</option>'+owners.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')+'<option value="__new">＋ เพิ่มเจ้าของใหม่</option>';$('owner').value=v}
$('owner').onchange=()=>{$('onew').style.display=$('owner').value==='__new'?'block':'none'};
function addOwner(n){if(n&&!owners.includes(n)){owners.push(n);owners.sort();try{localStorage.setItem(KEY+'-owners',JSON.stringify(owners))}catch(e){}drawOwners()}}

// 6. ระบบป้ายชูรับลูกค้า (Welcome Sign) + คลังโลโก้หลายแบบ
// =======================================================
const LOGO_STORE_KEY = KEY + '-logos';
const LOGO_SEL_KEY = KEY + '-logo-sel';
let logoList=[];
try{logoList=JSON.parse(localStorage.getItem(LOGO_STORE_KEY)||'[]')}catch(e){logoList=[]}
let selectedLogoId = localStorage.getItem(LOGO_SEL_KEY) || (logoList[0]?.id || '');

function saveLogos(){
  try{
    localStorage.setItem(LOGO_STORE_KEY, JSON.stringify(logoList));
    localStorage.setItem(LOGO_SEL_KEY, selectedLogoId);
    return true;
  }catch(e){
    alert('พื้นที่เก็บโลโก้ในเครื่องเต็ม กรุณาลบโลโก้ที่ไม่ใช้ออกบางส่วนก่อนครับ');
    return false;
  }
}

// ย่อขนาดรูปโลโก้ก่อนบันทึก (ความกว้าง/สูงไม่เกิน 420px คงความโปร่งใส PNG)
function resizeLogoFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const maxSide=420;
        let w=img.width, h=img.height;
        if(w>maxSide || h>maxSide){
          const ratio=Math.min(maxSide/w, maxSide/h);
          w=Math.round(w*ratio); h=Math.round(h*ratio);
        }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror=reject;
      img.src=ev.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

// วาดแถบคลังโลโก้ให้คลิกเลือก/ลบ/เพิ่มได้ทันที
function renderLogoBar(){
  let html=`<div class="logo-item${!selectedLogoId?' on':''}" data-lid="">
    <span class="logo-none">ไม่ใช้<br>โลโก้</span>
  </div>`;

  logoList.forEach(item=>{
    const on = (selectedLogoId===item.id) ? ' on' : '';
    html+=`<div class="logo-item${on}" data-lid="${item.id}" title="${esc(item.name)}">
      <img src="${item.data}" alt="${esc(item.name)}">
      <button type="button" class="logo-del" data-ldel="${item.id}" title="ลบโลโก้นี้">×</button>
    </div>`;
  });

  html+=`<button type="button" class="logo-add-btn" id="logoAddBtn">＋ เพิ่มโลโก้</button>`;
  $('sLogoList').innerHTML=html;

  // คลิกเลือกโลโก้
  $('sLogoList').querySelectorAll('.logo-item').forEach(el=>{
    el.onclick=()=>{
      selectedLogoId=el.dataset.lid||'';
      saveLogos();
      renderLogoBar();
      renderSignBoard();
    };
  });

  // คลิกปุ่ม × ลบโลโก้เฉพาะอัน
  $('sLogoList').querySelectorAll('[data-ldel]').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const id=btn.dataset.ldel;
      logoList=logoList.filter(x=>x.id!==id);
      if(selectedLogoId===id) selectedLogoId=logoList[0]?.id || '';
      saveLogos();
      renderLogoBar();
      renderSignBoard();
    };
  });

  // คลิกปุ่ม + เพิ่มโลโก้
  $('logoAddBtn').onclick=()=>$('sLogoFile').click();
}

$('sLogoFile').onchange=async e=>{
  const files=[...(e.target.files||[])];
  if(!files.length)return;
  for(const f of files){
    try{
      const dataUrl=await resizeLogoFile(f);
      const id='lg_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      logoList.push({ id, name: f.name, data: dataUrl });
      selectedLogoId=id;
    }catch(err){}
  }
  e.target.value='';
  if(!saveLogos()){
    logoList.pop();
    selectedLogoId=logoList[0]?.id || '';
  }
  renderLogoBar();
  renderSignBoard();
};

function getSignBoardHtml(){
  const head=$('sHead').value.trim();
  const name=$('sName').value.trim()||'ชื่อลูกค้า';
  const flight=$('sFlight').value.trim();
  const sub=$('sSub').value.trim();
  const theme=$('sTheme').value;
  const nameSz=Number($('sNameSz').value)||64;
  const logoSz=Number($('sLogoSz').value)||90;
  const activeLogo=logoList.find(x=>x.id===selectedLogoId);

  return `<div class="sign-board ${theme}">
    ${activeLogo ? `<img class="sb-logo" src="${activeLogo.data}" style="height:${logoSz}px" alt="logo">` : ''}
    ${head ? `<div class="sb-head">${esc(head)}</div>` : ''}
    <div class="sb-name" style="font-size:${nameSz}px">${esc(name)}</div>
    ${flight ? `<div class="sb-flight">✈️ ${esc(flight)}</div>` : ''}
    ${sub ? `<div class="sb-sub">${esc(sub)}</div>` : ''}
  </div>`;
}

function renderSignBoard(){
  $('sNameSzLbl').textContent=$('sNameSz').value;
  $('sLogoSzLbl').textContent=$('sLogoSz').value;
  $('signPreview').innerHTML=getSignBoardHtml();
}

function openSignModal(job){
  if(job){
    $('sName').value=job.name||'';
    $('sFlight').value=job.flight||'';
    $('sSub').value=job.to||'';
  }else{
    $('sName').value='';
    $('sFlight').value='';
    $('sSub').value='';
  }
  renderLogoBar();
  renderSignBoard();
  $('signModal').showModal();
}

['sHead','sTheme','sName','sFlight','sSub','sNameSz','sLogoSz'].forEach(id=>{

  $(id).addEventListener('change', renderSignBoard);
});
$('openSignTopBtn').onclick=()=>openSignModal(null);
$('signClose').onclick=()=>$('signModal').close();

// =======================================================
// 7. ระบบซิงก์ข้อมูลกับ Google Sheets อัตโนมัติ
// =======================================================
let busy=false,again=false,stm;
const setS=t=>{$('ss').textContent=t};
function sched(){clearTimeout(stm);stm=setTimeout(sync,1200)}

async function callSheetApi(payload){
  const url=(SCRIPT_URL||'').trim();
  const res=await fetch(url,{
    method:'POST',
    mode:'cors',
    redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  });
  const text=await res.text();
  try{return JSON.parse(text)}catch(e){
    throw new Error('Google Sheets ตอบกลับผิดรูปแบบ กรุณาเช็กการ Deploy เวอร์ชันใหม่');
  }
}

async function sync(){
  if(busy){again=true;return}
  busy=true;setS('☁️ กำลังซิงก์กับ Google Sheets...');
  try{
    const res=await callSheetApi({action:'get'});
    if(!res.ok)throw new Error(res.message||'ซิงก์ไม่สำเร็จ');
    const rem=res.data||[];
    const ts=x=>x.del?Math.max(+x.upd||0,Date.parse(x.del)||0):(+x.upd||0),m=new Map();
    [...jobs,...trash,...rem].forEach(x=>{if(!x.id)return;const o=m.get(x.id);if(!o||ts(x)>ts(o))m.set(x.id,x)});
    const all=[...m.values()].map(x=>({...x,upd:+x.upd||0}));
    jobs=all.filter(x=>!x.del);
    trash=all.filter(x=>x.del).sort((a,b)=>String(b.del).localeCompare(String(a.del)));
    fixT(jobs);fixT(trash);saveL();render();

    const saveRes=await callSheetApi({action:'save',data:[...jobs,...trash]});
    if(!saveRes.ok)throw new Error(saveRes.message||'บันทึกไม่สำเร็จ');
    setS('✅ ซิงก์แล้ว '+new Date().toLocaleTimeString('th-TH',{hour12:false,hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    setS('⚠️ ซิงก์ไม่สำเร็จ: '+e.message);
  }
  busy=false;
  if(again){again=false;sync()}
}

$('sy').onclick=()=>sync();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
addEventListener('online',()=>sync());

const ask=msg=>new Promise(r=>{const d=$('cf');$('cm').textContent=msg;const done=v=>{d.close();r(v)};$('cyes').onclick=()=>done(true);$('cno').onclick=()=>done(false);d.oncancel=()=>r(false);d.showModal()});
$('lg').innerHTML=Object.entries(TC).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('');

function renderTrash(){
  $('tb').innerHTML=trash.some(x=>!x.purged)?trash.map((j,i)=>j.purged?'':`<div class="job" style="border-left:5px solid ${jobColor(j)}"><div class="t">${esc(j.name)} · ${thDate(j.date)}${dayCount(j)>1?' – '+thShort(getEndDate(j)):''} ${esc(j.time||'')}</div><div class="sum">${esc(j.type)}${j.flight?' · ✈️ '+esc(j.flight):''}${j.from?' · '+esc(j.from):''}${j.to?' → '+esc(j.to):''}${j.price?' · '+baht(j.price)+' ฿':''}</div><div class="sum">ลบเมื่อ ${new Date(j.del).toLocaleString('th-TH',{hour12:false})}</div><div class="acts"><button class="btn sm" data-r="${i}">กู้คืน</button><button class="btn g sm" data-p="${i}" style="color:var(--rd)">ลบถาวร</button></div></div>`).join(''):'<div class="empty">ถังขยะว่าง</div>';
  $('tb').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const t=trash.splice(+b.dataset.r,1)[0];delete t.del;delete t.purged;t.upd=Date.now();jobs.push(t);save();renderTrash();render()});
  $('tb').querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{if(await ask('ลบถาวร? กู้คืนไม่ได้อีก')){trash[+b.dataset.p]={...trash[+b.dataset.p],purged:1,del:new Date().toISOString()};save();renderTrash()}});
}
$('tr').onclick=()=>{renderTrash();$('td').showModal()};
$('tx').onclick=()=>$('td').close();
$('tc').onclick=async()=>{if(trash.length&&await ask('ล้างถังขยะทั้งหมด? กู้คืนไม่ได้อีก')){trash=trash.map(x=>({...x,purged:1,del:new Date().toISOString()}));save();renderTrash()}};

$('date').value=sel;
drawSwatches('');
render();
sync();
</script>
